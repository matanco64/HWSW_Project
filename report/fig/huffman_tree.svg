<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 168" style="max-width:520px" role="img"
     aria-label="Huffman tree with codes and the canonical decode idea">
  <g stroke="#7d8796" stroke-width="1.3" fill="none">
    <path d="M250,18 L180,58"/><path d="M250,18 L320,58"/>
    <path d="M180,58 L140,100"/><path d="M180,58 L220,100"/>
    <path d="M320,58 L285,100"/><path d="M320,58 L355,100"/>
    <path d="M285,100 L258,140"/><path d="M285,100 L312,140"/>
  </g>
  <g font-size="9.5" fill="#9b1c1c" font-family="monospace">
    <text x="207" y="35">0</text><text x="288" y="35">1</text>
    <text x="152" y="80">0</text><text x="205" y="80">1</text>
    <text x="295" y="80">0</text><text x="342" y="80">1</text>
    <text x="264" y="122">0</text><text x="305" y="122">1</text>
  </g>
  <g><circle cx="250" cy="18" r="6" fill="#7d8796"/><circle cx="180" cy="58" r="6" fill="#7d8796"/>
     <circle cx="320" cy="58" r="6" fill="#7d8796"/><circle cx="285" cy="100" r="6" fill="#7d8796"/></g>
  <g font-family="monospace" font-size="11">
    <rect x="124" y="92" width="32" height="17" fill="#eef1f5" stroke="#c8cdd6"/><text x="140" y="105" text-anchor="middle">a</text>
    <rect x="204" y="92" width="32" height="17" fill="#eef1f5" stroke="#c8cdd6"/><text x="220" y="105" text-anchor="middle">b</text>
    <rect x="339" y="92" width="32" height="17" fill="#eef1f5" stroke="#c8cdd6"/><text x="355" y="105" text-anchor="middle">c</text>
    <rect x="242" y="132" width="32" height="17" fill="#eef1f5" stroke="#c8cdd6"/><text x="258" y="145" text-anchor="middle">d</text>
    <rect x="296" y="132" width="32" height="17" fill="#eef1f5" stroke="#c8cdd6"/><text x="312" y="145" text-anchor="middle">e</text>
  </g>
  <g font-family="monospace" font-size="10" fill="#3d4450">
    <text x="20" y="30" font-family="sans-serif" font-weight="600" fill="#16181d">codes</text>
    <text x="20" y="48">a = 00</text><text x="20" y="63">b = 01</text><text x="20" y="78">c = 11</text>
    <text x="20" y="93">d = 100</text><text x="20" y="108">e = 101</text>
    <text x="20" y="132" font-family="sans-serif" fill="#9b1c1c">shorter code</text>
    <text x="20" y="145" font-family="sans-serif" fill="#9b1c1c">= commoner symbol</text>
  </g>
  <g font-family="sans-serif" font-size="10" fill="#16181d">
    <text x="410" y="30" font-weight="600">canonical form</text>
    <text x="410" y="47" font-family="monospace" font-size="9.5">len 2: first=00</text>
    <text x="410" y="61" font-family="monospace" font-size="9.5">len 3: first=100</text>
    <text x="410" y="80">decode = compare</text><text x="410" y="94">against 2 numbers,</text>
    <text x="410" y="108">not walk 258</text><text x="410" y="122">table entries</text>
  </g>
</svg>
